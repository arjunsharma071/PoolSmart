services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: poolsmart
      POSTGRES_USER: poolsmart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - poolsmart-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poolsmart -d poolsmart"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://poolsmart:${POSTGRES_PASSWORD}@database:5432/poolsmart
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  poolsmart-postgres:
